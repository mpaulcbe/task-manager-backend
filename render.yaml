
services:
  - type: web
    name: task-manager-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn taskmanager.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString

databases:
  - name: task-manager-db
    plan: free
